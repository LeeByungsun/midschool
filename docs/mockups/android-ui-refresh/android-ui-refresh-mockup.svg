  <g transform="translate(1268 206)" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">
    <text x="0" y="0" fill="#173B66" font-size="28" font-weight="800">Design notes</text>

    <text x="0" y="54" fill="#0F172A" font-size="18" font-weight="700">Current → mockup mapping</text>
    <text x="0" y="84" fill="#475569" font-size="15" font-weight="500">• MainActivity: hero hierarchy + richer summary cards</text>
    <text x="0" y="108" fill="#475569" font-size="15" font-weight="500">• TimetableActivity: stronger day switch + lesson cards</text>
    <text x="0" y="132" fill="#475569" font-size="15" font-weight="500">• ScheduleActivity: date cards + importance grouping</text>
    <text x="0" y="156" fill="#475569" font-size="15" font-weight="500">• Settings/Setup: same rounded-card form language</text>

    <text x="0" y="220" fill="#0F172A" font-size="18" font-weight="700">Visual direction</text>
    <text x="0" y="250" fill="#475569" font-size="15" font-weight="500">• Keep current blue palette, but increase contrast and depth</text>
    <text x="0" y="274" fill="#475569" font-size="15" font-weight="500">• Promote date / class / state into reusable chips</text>
    <text x="0" y="298" fill="#475569" font-size="15" font-weight="500">• Separate dense data into smaller cards for readability</text>
    <text x="0" y="322" fill="#475569" font-size="15" font-weight="500">• Let timer feel calmer, not heavier, on the dashboard</text>

    <text x="0" y="386" fill="#0F172A" font-size="18" font-weight="700">No-code scope</text>
    <text x="0" y="416" fill="#475569" font-size="15" font-weight="500">• App code/resources remain untouched</text>
    <text x="0" y="440" fill="#475569" font-size="15" font-weight="500">• Deliverable is an editable SVG + notes only</text>
    <text x="0" y="464" fill="#475569" font-size="15" font-weight="500">• Built from the current XML layouts and strings</text>

    <text x="0" y="528" fill="#0F172A" font-size="18" font-weight="700">Tokens used</text>
